<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Воксельный остров, где ты обустраиваешь место для четверых людей."
    />
    <title>Гавань</title>
  </head>
  <body>
    <!--
      Канвас помечен как картинка с подписью, а не как приложение: всё, что на нём происходит,
      продублировано текстом в HUD — жители, склад, дневник. Экранный диктор читает их, а не
      пытается пересказать сцену (§8 ТЗ).
    -->
    <canvas
      id="scene"
      role="img"
      aria-label="Остров: море, берег и дома. Всё, что на нём происходит, есть словами в панелях рядом"
    ></canvas>
    <main id="hud" aria-label="Гавань"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
